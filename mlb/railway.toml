# Railway service config for the MLB daily worker (cron).
# Root directory for this service in the Railway dashboard: mlb/
#
# DUAL-RUN (2026-08-02, task #163's follow-up): fires twice a day so
# tomorrow's slate is ready the moment the site's displayed day flips at
# midnight Eastern, not hours later once the morning cron happens to run.
# Cron syntax supports comma-separated hours in one field -- both firings
# share this one schedule, no second Railway service needed:
#   01:00 UTC = ~9pm ET the night before (EDT) -- populates tomorrow's
#     slate with best-available data (RotoWire's lineup-projection tiers
#     already handle "lineups not confirmed yet", see generate_daily_props.py).
#   14:00 UTC = ~10am ET same day (EDT) -- refreshes that same slate once
#     real lineups are typically confirmed (unchanged from before).
# src/utils/tz.py's default_slate_date() picks the right target
# automatically based on the real Eastern hour at the moment each one
# fires -- no mode flag or second command needed.
#
# Real bug fixed here too: the previous single-run "10:00 ET" cron used a
# `date.today() + 1 day` default computed against the container's UTC
# clock, which overshot to tomorrow even when it was still today in
# Eastern time (UTC and Eastern only diverge overnight -- see tz.py).
#
# DST caveat (documented, not solved): the literal UTC values above are
# EDT-accurate; during EST months (Nov-Mar) each fires one Eastern hour
# earlier than intended. MLB's season runs entirely within EDT (Mar-Nov)
# so this is a non-issue in practice for this specific service.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m src.pipeline.generate_daily_props && python -m src.pipeline.export_to_site_db"
cronSchedule = "0 1,14 * * *"
restartPolicyType = "NEVER"
