# Railway service config for the NBA daily worker (cron).
# Root directory for this service in the Railway dashboard: nba/
#
# RESOLVED (2026-08-02): stats.nba.com was silently black-holing requests
# from Railway's egress IP range at TWO independent layers -- an IP-reputation
# block (fixed by routing through a Webshare residential proxy, see
# NBA_STATS_PROXY_URL) AND a TLS/HTTP fingerprint block (plain `requests`'s
# handshake doesn't look like a real browser's; fixed via curl_cffi's Chrome
# impersonation, see src/utils/nba_proxy.py). Confirmed live: a full data
# refresh (schedule/box scores/PBP/tracking/rosters/matchups/defensive/
# stints, ~1300 games) completed cleanly end-to-end for the first time.
#
# DUAL-RUN (2026-08-02): fires twice a day so tomorrow's slate is ready the
# moment the site's displayed day flips at midnight Eastern, not hours
# later once the morning cron happens to run. One cronSchedule, comma-
# separated hours, no second Railway service needed:
#   01:00 UTC = ~9pm ET the night before (EDT) -- populates tomorrow's slate.
#   14:00 UTC = ~10am ET same day (EDT) -- refreshes it (unchanged timing).
# src/utils/tz.py's default_slate_date() picks the right target
# automatically based on the real Eastern hour at the moment each one
# fires -- no mode flag or second command needed. Also fixes a real
# UTC-vs-Eastern day-boundary bug this same helper was built to close
# (MLB's identical version of this bug is the one that actually surfaced
# live -- this service's plain `date.today()` default was only ever
# correct by coincidence of sharing that same 14:00 UTC hour, not because
# it was actually timezone-aware).
#
# DST caveat (documented, not solved): the literal UTC values above are
# EDT-accurate; during EST months (Nov-Mar, squarely within the NBA
# season) each fires one Eastern hour earlier than intended -- a known,
# lower-severity gap, not attempted here.

[build]
builder = "NIXPACKS"

[deploy]
# Slack daily-picks digest (2026-08-04) -- see mlb/railway.toml's own
# comment for the full design (dedup by slate_key on the site side, `||
# true` so a hiccup here never fails the pipeline run).
startCommand = "python -m src.pipeline.generate_predictions && python -m src.pipeline.generate_props && python -m src.pipeline.export_to_site_db && curl -s -X POST -H \"X-Notify-Token: $NOTIFY_TOKEN\" \"$NOTIFY_URL/internal/notify/nba\" || true"
cronSchedule = "0 1,14 * * *"
restartPolicyType = "NEVER"
