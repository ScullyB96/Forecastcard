# Railway service config for the NBA daily worker (cron).
# Root directory for this service in the Railway dashboard: nba/
#
# PAUSED (2026-08-02): a real live test from this exact container confirmed
# stats.nba.com silently black-holes requests from Railway's egress IP range
# (TCP connects fine, HTTP response never arrives -- a datacenter-IP-reputation
# block, not a transient timeout or a header/UA issue; general internet and
# even plain www.nba.com both work fine from the same container). No amount
# of retrying/backoff fixes an IP-level block, so this service is deliberately
# left with no cronSchedule and restartPolicyType=NEVER until a real fix
# lands (proxy/residential egress, or an alternate data source) -- see
# conversation history for the fix options considered. Re-add cronSchedule
# (matching mlb/nhl's "0 14 * * *" pattern) once that's resolved.
#
# 10:00 ET = 14:00 UTC during EDT (Mar-Nov) or 15:00 UTC during EST
# (Nov-Mar) -- picked 14:00 UTC as a placeholder; re-check against the
# actual current DST offset when this is actually deployed.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m src.pipeline.generate_predictions && python -m src.pipeline.generate_props && python -m src.pipeline.export_to_site_db"
restartPolicyType = "NEVER"
