# Railway service config for the NFL Tuesday worker (cron).
# Root directory for this service in the Railway dashboard: nfl/
# Config file path for this service: nfl/railway.tuesday.toml (Railway's
# "Config-as-code path" setting -- NOT the default railway.toml, since NFL
# needs 2 separate cron schedules from the same directory; see
# railway.sunday.toml for the other one).
#
# Tuesday 9:21am ET (per the original weekly_update.py plan) = 13:21 UTC
# during EDT (Mar-Nov) or 14:21 UTC during EST (Nov-Mar) -- picked 13:21
# UTC as a placeholder; re-check against the actual current DST offset
# when this is actually deployed.

# buildCommand override needed because requirements.txt deliberately
# excludes nfl_data_py (see its own comment there) -- installed separately
# here with --no-deps to avoid a real ResolutionImpossible pip error
# (nfl_data_py's published numpy<2.0/pandas<2.0 pins are stale; this
# combo is confirmed working in practice, just not pip-resolvable as one
# flat install).
[build]
builder = "NIXPACKS"
buildCommand = "pip install --no-deps nfl_data_py==0.3.3 && pip install -r requirements.txt"
# 2026-08-06: scope rebuilds to this sport's own directory -- see
# mlb/railway.toml's own comment for why (a real incident: an unrelated
# push elsewhere in the monorepo redeployed and killed an in-flight cron
# job for a different sport, since every service previously rebuilt on
# every push regardless of which sport's files changed).
watchPatterns = ["nfl/**"]

[deploy]
# Slack daily-picks digest (2026-08-04) -- see mlb/railway.toml's own
# comment for the full design; see railway.sunday.toml's own comment for
# why NFL's weekly slate_key still dedups correctly across this and the
# Sunday cron.
startCommand = "python -m src.pipeline.weekly_update && python -m src.pipeline.export_to_site_db && curl -s -X POST -H \"X-Notify-Token: $NOTIFY_TOKEN\" \"$NOTIFY_URL/internal/notify/nfl\" || true"
cronSchedule = "21 13 * * 2"
restartPolicyType = "NEVER"
