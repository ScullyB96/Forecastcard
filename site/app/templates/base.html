<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Predictions{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/countdown.js" defer></script>
  <script src="/static/props-filter.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Predictions</a>
    <nav class="sport-nav">
      <a href="/" class="{{ 'active' if active_sport is not defined else '' }}">All</a>
      {% for s in sports %}
      <a href="/{{ s }}" class="{{ s }} {{ 'active' if active_sport == s else '' }}">{{ s|upper }}</a>
      {% endfor %}
    </nav>
    {% if site_password() %}
    <a class="sign-out" href="/logout">Sign out</a>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
